<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Путешествие</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #1a0a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #game-container {
      width: 100%;
      height: calc(100vh - 32px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game-container canvas {
      border: 3px solid #ff69b4;
      border-radius: 8px;
      box-shadow: 0 0 30px #ff69b488;
    }
    #controls {
      color: #ffccff;
      height: 28px;
      line-height: 28px;
      font-size: 13px;
      text-align: center;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="controls">
    ⬅️➡️ — идти &nbsp;|&nbsp; ⬆️ или Пробел — прыжок &nbsp;|&nbsp; F — бросить яблоко
  </div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
